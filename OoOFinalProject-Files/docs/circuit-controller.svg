<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1560 900" width="1560" height="900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20,0 H0 V20" fill="none" stroke="#ececec" stroke-width="1"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <symbol id="cloud" viewBox="0 0 100 70" preserveAspectRatio="none"><path d="M24,62 C9,62 3,50 12,41 C3,31 13,15 28,21 C31,7 54,3 61,15 C70,4 92,10 88,27 C100,32 98,55 83,56 C82,68 62,71 53,63 C45,71 27,70 24,62 Z" fill="#ffffff" stroke="#333" stroke-width="1.6" vector-effect="non-scaling-stroke"/></symbol>
    <style>
      .mod  { fill:#fff2cc; stroke:#d6b656; stroke-width:2 }
      .reg  { fill:#dae8fc; stroke:#6c8ebf; stroke-width:2 }
      .clk  { fill:none; stroke:#6c8ebf; stroke-width:1.6 }
      .w    { stroke:#222; stroke-width:1.8; fill:none }
      .n    { fill:#222; text-anchor:middle; font-size:16px }
      .p    { fill:#222; font-size:15px }
      .ann  { fill:#444; font-style:italic; font-size:14px }
    </style>
  </defs>

  <rect width="1560" height="900" fill="#ffffff"/>
  <rect width="1560" height="900" fill="url(#grid)"/>

  <text x="40" y="56" style="font-size:30px" font-weight="700" fill="#222">Controller · circuit level</text>
  <text x="40" y="88" style="font-size:17px" fill="#555">rtl/acc_controller.sv (implemented)</text>

  <use href="#cloud" xlink:href="#cloud" x="1150" y="28" width="62" height="42"/>
  <text x="1222" y="55" class="p">combinational</text>
  <rect class="reg" x="1350" y="32" width="54" height="34"/>
  <path class="clk" d="M1356,66 l7,-9 l7,9"/>
  <text x="1414" y="55" class="p">register</text>

  <rect class="mod" x="260" y="140" width="1120" height="710"/>
  <text x="820" y="174" class="n" style="font-size:20px" font-weight="700">acc_controller</text>

  <!-- FSM -->
  <path class="w" d="M110,240 H343" marker-end="url(#a)"/>
  <text x="110" y="232" class="p">activate_i</text>
  <path class="w" d="M110,295 H340" marker-end="url(#a)"/>
  <text x="110" y="287" class="p">engine_done_i</text>

  <use href="#cloud" xlink:href="#cloud" x="335" y="200" width="200" height="135"/>
  <text x="435" y="263" class="n">Next-state</text>
  <text x="435" y="283" class="n">logic</text>
  <path class="w" d="M535,268 H620" marker-end="url(#a)"/>
  <rect class="reg" x="620" y="233" width="160" height="70"/>
  <path class="clk" d="M626,303 l8,-10 l8,10"/>
  <text x="700" y="273" class="n">state_q</text>
  <path class="w" d="M700,233 V158 H435 V206" marker-end="url(#a)"/>

  <path class="w" d="M780,268 H860" marker-end="url(#a)"/>
  <use href="#cloud" xlink:href="#cloud" x="860" y="200" width="200" height="135"/>
  <text x="960" y="263" class="n">Output</text>
  <text x="960" y="283" class="n">decode</text>
  <path class="w" d="M1060,268 H1500" marker-end="url(#a)"/>
  <text x="1400" y="220" class="p">done_o</text>
  <text x="1400" y="240" class="p">start_o</text>
  <text x="1400" y="260" class="p">res_we_o (MAGIC)</text>

  <!-- layer sequencing -->
  <path class="w" d="M750,303 V400 H1120" marker-end="url(#a)"/>
  <text x="935" y="392" class="ann" text-anchor="middle">advance on engine_done_i</text>
  <rect class="reg" x="1120" y="365" width="160" height="70"/>
  <path class="clk" d="M1126,435 l8,-10 l8,10"/>
  <text x="1200" y="405" class="n">layer_q</text>
  <path class="w" d="M1280,400 H1500" marker-end="url(#a)"/>
  <text x="1400" y="392" class="p">layer_o</text>

  <!-- job capture and checks -->
  <path class="w" d="M110,500 H340" marker-end="url(#a)"/>
  <text x="110" y="472" class="p">memory_location_i</text>
  <text x="110" y="492" class="p">length_i</text>
  <rect class="reg" x="340" y="465" width="160" height="70"/>
  <path class="clk" d="M346,535 l8,-10 l8,10"/>
  <text x="420" y="505" class="n">loc_q, len_q</text>

  <path class="w" d="M500,500 H580" marker-end="url(#a)"/>
  <use href="#cloud" xlink:href="#cloud" x="580" y="430" width="200" height="135"/>
  <text x="680" y="495" class="n">Config</text>
  <text x="680" y="515" class="n">checks</text>
  <path class="w" d="M640,440 V375 H470 V333" marker-end="url(#a)"/>
  <text x="555" y="367" class="ann" text-anchor="middle">cfg_ok, par_ok</text>

  <path class="w" d="M780,500 H880" marker-end="url(#a)"/>
  <rect class="reg" x="880" y="465" width="160" height="70"/>
  <path class="clk" d="M886,535 l8,-10 l8,10"/>
  <text x="960" y="505" class="n">error_q</text>
  <path class="w" d="M1040,500 H1500" marker-end="url(#a)"/>
  <text x="1400" y="492" class="p">error_o</text>

  <!-- PARAM preload -->
  <path class="w" d="M110,610 H680 V642" marker-end="url(#a)"/>
  <text x="110" y="602" class="p">par_rdata_i</text>

  <rect class="reg" x="340" y="665" width="160" height="70"/>
  <path class="clk" d="M346,735 l8,-10 l8,10"/>
  <text x="420" y="705" class="n">par_idx_q</text>
  <path class="w" d="M500,700 H580" marker-end="url(#a)"/>
  <use href="#cloud" xlink:href="#cloud" x="580" y="635" width="200" height="130"/>
  <text x="680" y="705" class="n">PARAM write</text>

  <path class="w" d="M780,700 H880" marker-end="url(#a)"/>
  <text x="960" y="760" class="ann" text-anchor="middle">only if state_q == PARAM_DATA</text>
  <rect class="reg" x="880" y="665" width="160" height="70"/>
  <path class="clk" d="M886,735 l8,-10 l8,10"/>
  <text x="960" y="705" class="n">par_q[0..19]</text>
  <path class="w" d="M1040,700 H1500" marker-end="url(#a)"/>
  <text x="1400" y="672" class="p">shifts, biases</text>
  <text x="1400" y="692" class="p">→ engines</text>

  <path class="w" d="M1000,665 V590 H740 V557" marker-end="url(#a)"/>
  <text x="870" y="582" class="ann" text-anchor="middle">implicit reading</text>

  <path class="w" d="M420,735 V800 H1500" marker-end="url(#a)"/>
  <text x="1400" y="792" class="p">par_addr_o</text>
</svg>
