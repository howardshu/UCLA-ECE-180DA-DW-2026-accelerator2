<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1520 820" width="1520" height="820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20,0 H0 V20" fill="none" stroke="#ececec" stroke-width="1"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <symbol id="cloud" viewBox="0 0 100 70" preserveAspectRatio="none"><path d="M24,62 C9,62 3,50 12,41 C3,31 13,15 28,21 C31,7 54,3 61,15 C70,4 92,10 88,27 C100,32 98,55 83,56 C82,68 62,71 53,63 C45,71 27,70 24,62 Z" fill="#ffffff" stroke="#333" stroke-width="1.6" vector-effect="non-scaling-stroke"/></symbol>
    <style>
      .mod  { fill:#fff2cc; stroke:#d6b656; stroke-width:2 }
      .reg  { fill:#dae8fc; stroke:#6c8ebf; stroke-width:2 }
      .clk  { fill:none; stroke:#6c8ebf; stroke-width:1.6 }
      .w    { stroke:#222; stroke-width:1.8; fill:none }
      .n    { fill:#222; text-anchor:middle; font-size:16px }
      .p    { fill:#222; font-size:15px }
      .ann  { fill:#444; font-style:italic; font-size:14px }
    </style>
  </defs>

  <rect width="1520" height="820" fill="#ffffff"/>
  <rect width="1520" height="820" fill="url(#grid)"/>

  <text x="40" y="56" style="font-size:30px" font-weight="700" fill="#222">Weight registers · circuit level</text>
  <text x="40" y="88" style="font-size:17px" fill="#555">Proposed design inside rtl/acc_conv.sv (the conv engine is still a stub)</text>

  <use href="#cloud" xlink:href="#cloud" x="1110" y="28" width="62" height="42"/>
  <text x="1182" y="55" class="p">combinational</text>
  <rect class="reg" x="1310" y="32" width="54" height="34"/>
  <path class="clk" d="M1316,66 l7,-9 l7,9"/>
  <text x="1374" y="55" class="p">register</text>

  <rect class="mod" x="260" y="140" width="1080" height="640"/>
  <text x="800" y="172" class="n" style="font-size:20px" font-weight="700">acc_conv · weight register file</text>

  <!-- preload: counter and address -->
  <path class="w" d="M110,200 H930 V232" marker-end="url(#a)"/>
  <text x="110" y="192" class="p">cfg_wgt_base_i</text>
  <path class="w" d="M110,285 H333" marker-end="url(#a)"/>
  <text x="110" y="277" class="p">start_i</text>

  <use href="#cloud" xlink:href="#cloud" x="330" y="225" width="180" height="120"/>
  <text x="420" y="290" class="n">Preload logic</text>
  <path class="w" d="M510,285 H590" marker-end="url(#a)"/>
  <rect class="reg" x="590" y="250" width="160" height="70"/>
  <path class="clk" d="M596,320 l8,-10 l8,10"/>
  <text x="670" y="290" class="n">ld_idx_q</text>
  <path class="w" d="M630,320 V380 H420 V343" marker-end="url(#a)"/>

  <path class="w" d="M750,285 H830" marker-end="url(#a)"/>
  <use href="#cloud" xlink:href="#cloud" x="830" y="225" width="200" height="120"/>
  <text x="930" y="290" class="n">Address logic</text>
  <path class="w" d="M1030,285 H1480" marker-end="url(#a)"/>
  <text x="1360" y="277" class="p">wgt_addr_o</text>

  <!-- write path -->
  <path class="w" d="M710,320 V440" marker-end="url(#a)"/>
  <text x="722" y="395" class="ann">1-cycle delay</text>
  <rect class="reg" x="590" y="440" width="160" height="70"/>
  <path class="clk" d="M596,510 l8,-10 l8,10"/>
  <text x="670" y="480" class="n">ld_idx_d1</text>

  <path class="w" d="M590,475 H110" marker-end="url(#a)"/>
  <text x="114" y="467" class="p">preload_done</text>

  <path class="w" d="M750,475 H830" marker-end="url(#a)"/>
  <use href="#cloud" xlink:href="#cloud" x="830" y="410" width="200" height="130"/>
  <text x="930" y="480" class="n">Write logic</text>
  <path class="w" d="M110,590 H930 V537" marker-end="url(#a)"/>
  <text x="110" y="582" class="p">wgt_rdata_i</text>

  <path class="w" d="M1030,475 H1110" marker-end="url(#a)"/>
  <text x="1205" y="428" class="ann" text-anchor="middle">only if ld_valid_d1</text>
  <rect class="reg" x="1110" y="440" width="190" height="70"/>
  <path class="clk" d="M1116,510 l8,-10 l8,10"/>
  <text x="1205" y="480" class="n">w_q[0..224]</text>

  <!-- read path -->
  <path class="w" d="M1205,510 V610" marker-end="url(#a)"/>
  <text x="1217" y="565" class="ann">implicit reading</text>
  <path class="w" d="M110,675 H1112" marker-end="url(#a)"/>
  <text x="110" y="667" class="p">k_rd (from MAC sequencer)</text>
  <use href="#cloud" xlink:href="#cloud" x="1105" y="610" width="200" height="130"/>
  <text x="1205" y="671" class="n">Combinational</text>
  <text x="1205" y="691" class="n">read</text>
  <path class="w" d="M1305,675 H1480" marker-end="url(#a)"/>
  <text x="1360" y="647" class="p">w0, w1, w2</text>
  <text x="1360" y="667" class="p">→ PE 0, 1, 2</text>
</svg>
